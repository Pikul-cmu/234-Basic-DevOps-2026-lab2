<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The DevOps Student List</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <header>
            <h1>The DevOps Student List</h1>
        </header>

        <table class="student-table">
            <thead>
                <tr>
                    <th></th>
                    <th>Student ID</th>
                    <th>Name Surname</th>
                    <th>Nickname</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td data-label="Avatar" class="avatar-cell">
                        <img src="assets/trump_real.jpg" alt="Donald Trump Avatar" class="avatar-img" />
                    </td>
                    <td data-label="Student ID">6501000001</td>
                    <td data-label="Name Surname">Donald Trump</td>
                    <td data-label="Nickname">Donny</td>
                </tr>
                <tr>
                    <td data-label="Avatar" class="avatar-cell">
                         <img src="my_image.png" alt="New Student Avatar" class="avatar-img">
                    </td>
                    <td data-label="Student ID">682115009</td>
                    <td data-label="Name Surname">Jadsadaporn Moongviriya</td>
                    <td data-label="Nickname">Game</td>
</tr>
           
            </tbody>
        </table>
        
    </div>

    <script>
        // Reload page every 30 seconds
        setInterval(() => {
            location.reload();
        }, 30 * 1000); // 30 seconds in milliseconds
    </script>
</body>

</html>
